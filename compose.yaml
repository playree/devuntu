services:
  devuntu:
    image: playree/devuntu:latest
    container_name: devuntu
    ports:
      - 3000:3000
    volumes:
      - ./upload:/app/upload
    restart: unless-stopped
    env_file: ./.env.docker
    depends_on:
      - db
  db:
    image: postgres:18
    container_name: devuntu-postgres
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devPassW0rd
      POSTGRES_DB: devuntu
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'pg_isready', '-d', 'devuntu', '-U', 'devuser']
      interval: 30s
      timeout: 20s
      retries: 3
volumes:
  pgdata:
