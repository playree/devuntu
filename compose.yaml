x-app-image: &app-image playree/devuntu:latest

services:
  devuntu:
    image: *app-image
    container_name: devuntu
    ports:
      - 3000:3000
    restart: unless-stopped
    env_file: ./.env.docker
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy

  db:
    image: postgres:18
    container_name: devuntu-postgres
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devPassW0rd
      POSTGRES_DB: devuntu
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'pg_isready', '-d', 'devuntu', '-U', 'devuser']
      interval: 30s
      timeout: 20s
      retries: 3

  s3:
    image: chrislusf/seaweedfs:4.40
    container_name: devuntu-seaweedfs
    # server モードで master/volume/filer/s3 をまとめて起動する
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0
    ports:
      - 8333:8333 # S3 API
    volumes:
      - seaweeddata:/data
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9333/cluster/status']
      interval: 30s
      timeout: 20s
      retries: 3

  # S3のバックアップ/リストアスクリプトを実行するための使い捨てコンテナ。
  # profiles を付けているので docker compose up では起動せず、
  # docker compose run --rm s3-tools で指定したときだけ有効になる。
  s3-tools:
    image: *app-image
    profiles: ['tools']
    env_file: ./.env.docker
    # docker-entrypoint.sh を上書きして prisma migrate deploy を走らせない
    entrypoint: ['node']
    command: ['/app/scripts/backup-s3.mjs']
    volumes:
      # ホスト側に backup/ が無いと Docker が root 所有で作るので、実行前に mkdir -p backup しておく
      - ./backup:/app/backup
    depends_on:
      s3:
        condition: service_healthy

volumes:
  pgdata:
  seaweeddata:
