x-app-image: &app-image playree/devuntu:latest

services:
  devuntu:
    image: *app-image
    container_name: devuntu
    ports:
      - 3000:3000
    restart: unless-stopped
    env_file: ./.env.docker
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy

  db:
    image: postgres:18
    container_name: devuntu-postgres
    # POSTGRES_* は setup-env が生成する .env.db から読む。
    # DATABASE_URL と別ファイルにしているのは、env_file がファイル内の全変数を
    # コンテナへ渡すため、アプリ側の秘密を db コンテナの環境に載せないようにするため
    env_file: ./.env.db
    # アプリからは devuntu ネットワーク内の db:5432 で到達するため、ホスト公開は
    # 開発時にホストから psql / prisma を繋ぐためだけのもの。外部へ晒さないよう loopback に限定する
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - pgdata:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d "$$POSTGRES_DB" -U "$$POSTGRES_USER"']
      interval: 30s
      timeout: 20s
      retries: 3

  s3:
    image: chrislusf/seaweedfs:4.40
    container_name: devuntu-seaweedfs
    # server モードで master/volume/filer/s3 をまとめて起動する
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0
    # db と同様、アプリからは s3:8333 で到達する。ホスト公開は loopback に限定する
    ports:
      - 127.0.0.1:8333:8333 # S3 API
    volumes:
      - seaweeddata:/data
      - type: bind
        source: ./seaweedfs-s3.json
        target: /etc/seaweedfs/s3.json
        read_only: true
        # 未作成のまま up すると Docker が同名の root 所有ディレクトリを作ってしまうため、
        # 存在しない場合はエラーにする(setup-env で生成する)
        bind:
          create_host_path: false
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9333/cluster/status']
      interval: 30s
      timeout: 20s
      retries: 3

  # .env.docker / .env.db / seaweedfs-s3.json を対話生成するための使い捨てコンテナ。
  # compose.yaml だけを置いた状態から docker compose run --rm setup-env で実行できる
  # (env_file を持つのは devuntu と s3-tools だけなので、.env.docker が無くても run は通る)。
  setup-env:
    image: *app-image
    profiles: ['tools']
    # entrypoint を node にすると node が PID 1 になり、シグナルの既定処理が無効で
    # Ctrl+C が効かなくなるため tini を挟む
    init: true
    # docker-entrypoint.sh を上書きして prisma migrate deploy を走らせない
    entrypoint: ['node']
    command: ['/app/scripts/setup-env/index.mjs']
    # /app へ重ねるとイメージ同梱の scripts/ と node_modules を潰すため /work へ当てる
    working_dir: /work
    volumes:
      - ./:/work

  # S3のバックアップ/リストアスクリプトを実行するための使い捨てコンテナ。
  # profiles を付けているので docker compose up では起動せず、
  # docker compose run --rm s3-tools で指定したときだけ有効になる。
  s3-tools:
    image: *app-image
    profiles: ['tools']
    env_file: ./.env.docker
    # docker-entrypoint.sh を上書きして prisma migrate deploy を走らせない
    entrypoint: ['node']
    command: ['/app/scripts/backup-s3.mjs']
    volumes:
      # ホスト側に backup/ が無いと Docker が root 所有で作るので、実行前に mkdir -p backup しておく
      - ./backup:/app/backup
    depends_on:
      s3:
        condition: service_healthy

volumes:
  pgdata:
  seaweeddata:
