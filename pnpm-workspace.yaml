allowBuilds:
  '@prisma/engines': true
  better-sqlite3: true
  prisma: true
  sharp: true
  unrs-resolver: true
# 自前の mddv の embed。公開直後に取り込むため除外する(公開から日が経てば不要なので削除する)
minimumReleaseAgeExclude:
  - markdown-design-doc-viewer-embed@1.5.3
onlyBuiltDependencies:
  - '@heroui/shared-utils'
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - sharp
  - unrs-resolver
overrides:
  sharp: '0.35.5'
# 各プラグインが peerDependencies に eslint@10 を載せたら削除する
peerDependencyRules:
  allowedVersions:
    eslint-plugin-import>eslint: '10'
    eslint-plugin-jsx-a11y>eslint: '10'
    eslint-plugin-react>eslint: '10'
