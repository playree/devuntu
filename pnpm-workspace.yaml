allowBuilds:
  '@prisma/engines': true
  better-sqlite3: true
  prisma: true
  sharp: true
  unrs-resolver: true
# 自前の mddv の embed。公開直後に取り込むため除外する(公開から日が経てば不要なので削除する)
minimumReleaseAgeExclude:
  - markdown-design-doc-viewer-embed@1.5.7
onlyBuiltDependencies:
  - '@heroui/shared-utils'
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - sharp
  - unrs-resolver
overrides:
  sharp: '0.35.5'
  # @prisma/config が effect を 3.22.1 以上(GHSA-7589-6fvf-x4pw の修正版)に上げたら削除する。docker/Dockerfile の Prisma Migrate 用にも同じ上書きがある
  '@prisma/config>effect': '^3.22.1'
# 各プラグインが peerDependencies に eslint@10 を載せたら削除する
peerDependencyRules:
  allowedVersions:
    eslint-plugin-import>eslint: '10'
    eslint-plugin-jsx-a11y>eslint: '10'
    eslint-plugin-react>eslint: '10'
