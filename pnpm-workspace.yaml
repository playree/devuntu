allowBuilds:
  '@prisma/engines': true
  better-sqlite3: true
  prisma: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - '@heroui/shared-utils'
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - sharp
  - unrs-resolver
overrides:
  sharp: '0.34.5'
patchedDependencies:
  # バージョンを固定する。上げたときにパッチが黙って当たり続けないようにするため
  '@heroui/react@3.2.2': patches/@heroui__react.patch
