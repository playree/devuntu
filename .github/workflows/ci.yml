name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # 型が壊れた状態でテストを流しても情報が増えないので、テストの前に置く。
      # src/generated はコミット済みなので prisma generate は不要
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # イメージと同じダミー値で standalone 出力まで通ることを見る。
      # リリース時のビルド失敗を PR の時点で拾う
      - name: Build
        run: |
          export DATABASE_URL="$(cat docker/dummy-secrets/database_url.env)"
          export BETTER_AUTH_URL="$(cat docker/dummy-secrets/better_auth_url.env)"
          export BETTER_AUTH_SECRET="$(cat docker/dummy-secrets/better_auth_secret.env)"
          pnpm build
