name: Promote stable

# リリース済みの version を stable にする。過去の version を指定すればロールバックにも使える
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'stable にする version(例: 0.9.3)'
        required: true
        type: string

permissions:
  # compose.yaml の取得元になる git タグ stable を動かすため
  contents: write

concurrency:
  group: promote-stable
  cancel-in-progress: false

env:
  IMAGE: playree/devuntu
  VERSION: ${{ inputs.version }}

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Verify input
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid version: $VERSION" >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Resolve release commit
        run: |
          git fetch --depth=1 origin "refs/tags/v$VERSION:refs/tags/v$VERSION" || {
            echo "tag v$VERSION not found" >&2
            exit 1
          }
          sha=$(git rev-parse "refs/tags/v$VERSION^{commit}")
          # この仕組みより前の版は compose.yaml が stable を参照しておらず、取得元にすると利用者が latest を追うことになる
          if ! git show "$sha:compose.yaml" | grep -q "$IMAGE:stable"; then
            echo "compose.yaml at v$VERSION does not use $IMAGE:stable" >&2
            exit 1
          fi
          echo "SHA=$sha" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Release の promote と同じく、ビルド元の commit がリリースタグと一致するイメージだけを付け替える。
      # 検査と付け替えの間に <version> が動いても巻き込まれないよう digest で固定する
      - name: Verify image
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{ .Manifest.Digest }}')
          rev=$(.github/scripts/image-revision.sh "$IMAGE@$digest")
          if [ "$rev" != "$SHA" ]; then
            echo "$IMAGE:$VERSION ($digest) is built from $rev, not v$VERSION ($SHA)" >&2
            exit 1
          fi
          echo "DIGEST=$digest" >> "$GITHUB_ENV"

      # compose.yaml の取得元。権限やルールセットで弾かれた場合にイメージだけ先に動かないよう、こちらを先に行う
      - name: Move stable tag
        run: |
          git tag -f stable "$SHA"
          git push -f origin refs/tags/stable

      - name: Promote to stable
        run: docker buildx imagetools create -t "$IMAGE:stable" "$IMAGE@$DIGEST"
