name: Release

on:
  # edge の publish は手動。実行時に対象の ref を選ぶ
  workflow_dispatch:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # push 済みタグの処理を途中で止めないよう、キャンセルはしない
  cancel-in-progress: false

env:
  IMAGE: playree/devuntu

jobs:
  # 選んだ ref をプラットフォームごとにビルドし、タグを付けずに digest だけ push する。
  # QEMU だと arm64 のビルドが遅いため、それぞれのネイティブランナーで並列に回す
  build:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Prepare
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=edge

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          # ここで付く org.opencontainers.image.revision を promote 側の突合に使う
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          secret-files: |
            database_url=docker/dummy-secrets/database_url.env
            better_auth_url=docker/dummy-secrets/better_auth_url.env
            better_auth_secret=docker/dummy-secrets/better_auth_secret.env
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # 各プラットフォームの digest をまとめて edge にする
  edge:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          refs=()
          for digest in *; do
            refs+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create -t "$IMAGE:edge" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:edge"

  # edge で確認済みのイメージに、そのまま version と latest を付ける
  promote:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify version
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "package.json=$pkg but tag=$tag" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 再ビルドすると確認したものと別のイメージになるため、edge を付け替える。
      # 検査と付け替えの間に edge が動いても巻き込まれないよう digest で固定し、
      # 付け替えてよいイメージかはビルド元の commit で判定する
      - name: Promote edge
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:edge" --format '{{ .Manifest.Digest }}')
          rev=$(.github/scripts/image-revision.sh "$IMAGE@$digest")
          if [ "$rev" != "$GITHUB_SHA" ]; then
            echo "edge ($digest) is built from $rev, not $GITHUB_SHA" >&2
            exit 1
          fi
          docker buildx imagetools create \
            -t "$IMAGE:${GITHUB_REF_NAME#v}" \
            -t "$IMAGE:latest" \
            "$IMAGE@$digest"
